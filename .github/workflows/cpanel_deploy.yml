name: Deploy to cPanel

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch

jobs:
  deploy:
    name: 🚀 Deploy via FTP to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Setup Node (if your project needs a build)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and build
        working-directory: ./client 
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_PAYSTACK_SECRET_KEY=${{ secrets.VITE_PAYSTACK_SECRET_KEY }}" >> .env
          echo "VITE_PAYSTACK_PUBLIC_KEY=${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}" >> .env
          cd client
          npm ci
          npm run build


      - name: 📂 Upload files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          server-dir: /public_html/bisum.hgbcinfluencers.org/  # Adjust this to your cPanel directory
          local-dir: ./client/dist/          # Adjust this to your project’s build folder
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/README.md
